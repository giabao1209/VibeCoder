name: Build VibeReader 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-1.0]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build

      - name: Verify output
        shell: pwsh
        run: |
          $exe = 'dist/VibeReader-1.0.0.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'dist contents:'
            Get-ChildItem -Recurse dist
            throw "Expected portable EXE not found: $exe"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeReader-1.0.0-Windows-Portable
          path: dist/VibeReader-1.0.0.exe
          if-no-files-found: error

      - name: Publish GitHub Release v1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'dist/VibeReader-1.0.0.exe'
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0 $exe --clobber
          } else {
            gh release create v1.0.0 $exe --title 'VibeReader 1.0.0' --notes 'Windows portable release. Download VibeReader-1.0.0.exe and run it directly; Node.js and npm are not required.' --target main
          }
