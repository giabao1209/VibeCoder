# VibeReader 1.2 release pipeline
name: Build VibeReader 1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-1.2]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Validate source scripts
        shell: pwsh
        run: |
          node --check markdown-renderer.js
          node --check renderer-v3.js
          node --check session-enhancer.js
          node --check session-bootstrap.js
          node --check multi-view.js
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '1.2.0') {
            throw 'package.json version is not 1.2.0'
          }

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Validate Mermaid integration
        shell: pwsh
        run: |
          if (-not (Test-Path 'node_modules/mermaid/dist/mermaid.esm.min.mjs')) {
            throw 'Mermaid browser runtime was not installed'
          }
          node test-mermaid-renderer.js

      - name: Build portable Windows EXE
        shell: pwsh
        run: npm run build

      - name: Verify output
        shell: pwsh
        run: |
          $exe = 'dist/VibeReader-1.2.0.exe'
          if (-not (Test-Path $exe)) {
            Write-Host 'dist contents:'
            Get-ChildItem -Recurse dist
            throw "Expected portable EXE not found: $exe"
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeReader-1.2.0-Windows-Portable
          path: dist/VibeReader-1.2.0.exe
          if-no-files-found: error

      - name: Publish GitHub Release v1.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'dist/VibeReader-1.2.0.exe'
          $notes = 'Mermaid diagram release. Markdown Mermaid fences now render as diagrams, and unlabelled fenced blocks are auto-detected when they start with directives such as classDiagram, flowchart, sequenceDiagram, stateDiagram, erDiagram, gantt, mindmap, and other Mermaid diagram types. Explicitly labelled source-code fences remain code. Includes regression coverage for the AActor/AController classDiagram case. Windows portable EXE; Node.js and npm are not required.'
          gh release view v1.2.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.2.0 $exe --clobber
          } else {
            gh release create v1.2.0 $exe --title 'VibeReader 1.2.0' --notes $notes --target main
          }
